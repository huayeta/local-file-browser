<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>📂 本地文件浏览器</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #171e2e;
    --panel2: #1e2740;
    --border: #2a3554;
    --text: #e8edf7;
    --muted: #8b96ad;
    --accent: #4f8cff;
    --dir: #ffc44d;
    --video: #ff6b6b;
    --audio: #51cf66;
    --pdf: #ff8787;
    --image: #66d9e8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 20px; background: var(--panel);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 18px; font-weight: 600; white-space: nowrap; }
  #roots-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-left: 8px; flex: 1; }
  .root-btn {
    background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 14px; cursor: pointer; font-size: 13px;
    transition: all .15s;
  }
  .root-btn:hover { border-color: var(--accent); }
  .root-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* 快捷访问栏（⭐ 直达常用文件夹） */
  #shortcuts-bar {
    display: flex; gap: 8px; flex-wrap: wrap;
    align-items: center; margin-left: 12px; padding-left: 12px;
    border-left: 1px solid var(--border);
  }
  #shortcuts-bar .sc-label { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .shortcut-btn {
    background: var(--panel2); color: var(--dir);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 14px; cursor: pointer; font-size: 13px;
    transition: all .15s;
  }
  .shortcut-btn:hover { border-color: var(--dir); transform: translateY(-1px); }

  /* 搜索框 */
  #search-box {
    display: flex; align-items: center; gap: 6px;
    margin-left: auto; max-width: 100%;
  }
  #search-input {
    background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 6px 10px; font-size: 13px; width: 180px;
    outline: none; transition: border-color .15s;
  }
  #search-input:focus { border-color: var(--accent); }
  #search-input::placeholder { color: var(--muted); }
  #search-type {
    background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 5px 6px; font-size: 12px; outline: none; cursor: pointer;
  }
  #search-clear {
    background: none; border: none; color: var(--muted); font-size: 15px;
    cursor: pointer; padding: 4px 6px; display: none;
  }
  #search-clear:hover { color: #fff; }
  mark { background: var(--dir); color: #1a1a1a; border-radius: 2px; padding: 0 2px; }
  .search-result-path { font-size: 11px; color: var(--muted); margin-left: 8px; flex-shrink: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  main { max-width: 1000px; margin: 0 auto; padding: 20px; }
  #breadcrumb {
    display: flex; align-items: center; gap: 6px;
    font-size: 14px; color: var(--muted);
    margin-bottom: 14px; flex-wrap: wrap;
  }
  #breadcrumb .crumb { color: var(--accent); cursor: pointer; }
  #breadcrumb .crumb:hover { text-decoration: underline; }
  #breadcrumb .sep { color: var(--muted); }
  #breadcrumb .cur { color: var(--text); }
  #back-btn {
    background: var(--panel2); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; padding: 4px 12px;
    cursor: pointer; font-size: 13px; margin-right: 4px;
  }
  #back-btn:hover { border-color: var(--accent); }
  #file-list { list-style: none; }
  .item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 10px;
    margin-bottom: 8px; cursor: pointer; transition: all .15s;
  }
  .item:hover { border-color: var(--accent); background: var(--panel2); transform: translateX(2px); }
  .item .icon { font-size: 22px; width: 30px; text-align: center; flex-shrink: 0; }
  .item .name { flex: 1; font-size: 14px; word-break: break-all; }
  .item .meta { font-size: 12px; color: var(--muted); flex-shrink: 0; }
  .item.dir .name { color: var(--dir); font-weight: 600; }
  .item.video .name { color: var(--video); }
  .item.audio .name { color: var(--audio); }
  .item.pdf .name { color: var(--pdf); }
  .item.image .name { color: var(--image); }
  .item.text .name { color: var(--accent); }
  /* 已访问（点击过）的文件：淡紫色，类似 a:visited 语义（放在类型色之后以覆盖） */
  .item.visited .name { color: #b39ddb; }
  .item.visited .icon { opacity: .85; }
  .empty { text-align: center; color: var(--muted); padding: 40px; }
  #loading { text-align: center; color: var(--muted); padding: 40px; }

  /* 播放器浮层 */
  #player-overlay {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 100;
    background: rgba(10, 14, 24, .95);
    border-top: 1px solid var(--border);
    padding: 12px 20px; display: none;
  }
  #player-overlay.show { display: block; }
  #player-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  #player-title { font-size: 13px; color: var(--text); flex: 1; word-break: break-all; }
  #player-close {
    background: var(--panel2); border: 1px solid var(--border);
    color: var(--muted); border-radius: 6px; padding: 3px 10px;
    cursor: pointer; font-size: 12px;
  }
  #player-close:hover { color: #fff; border-color: var(--accent); }
  #player-fullscreen {
    background: var(--panel2); border: 1px solid var(--border);
    color: var(--muted); border-radius: 6px; padding: 3px 10px;
    cursor: pointer; font-size: 12px;
  }
  #player-fullscreen:hover { color: #fff; border-color: var(--accent); }
  #video-wrap { position: relative; }
  /* 全屏时右下角的大播放/暂停按钮（bottom 抬高避开原生控制条） */
  #fs-play-toggle {
    position: absolute; right: 20px; bottom: 100px;
    width: 72px; height: 72px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.7);
    background: rgba(0,0,0,.55); color: #fff;
    font-size: 30px; line-height: 1; cursor: pointer;
    display: none; align-items: center; justify-content: center;
    z-index: 10; transition: background .15s, transform .1s;
  }
  #fs-play-toggle:hover { background: rgba(0,0,0,.8); transform: scale(1.08); }
  #fs-play-toggle:active { transform: scale(.95); }
  #player-overlay video, #player-overlay audio { width: 100%; max-height: 55vh; border-radius: 8px; background: #000; }
  #player-overlay audio { height: 46px; }
  /* 全屏时视频占满整个容器（覆盖上面的 max-height: 55vh 限制，含 Safari 前缀） */
  #video-wrap:fullscreen,
  #video-wrap:-webkit-full-screen {
    width: 100%; height: 100%;
  }
  #video-wrap:fullscreen video,
  #video-wrap:-webkit-full-screen video {
    width: 100%; height: 100%; max-height: none;
    object-fit: contain;
  }
  /* 全屏时右上角的退出全屏按钮（触屏无键盘也能退出） */
  #fs-exit-toggle {
    position: absolute; right: 20px; top: 20px;
    width: 56px; height: 56px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.7);
    background: rgba(0,0,0,.55); color: #fff;
    font-size: 22px; line-height: 1; cursor: pointer;
    display: none; align-items: center; justify-content: center;
    z-index: 10; transition: background .15s, transform .1s;
  }
  #fs-exit-toggle:hover { background: rgba(0,0,0,.8); transform: scale(1.08); }
  #player-hint { font-size: 12px; color: var(--muted); margin-top: 6px; }

  /* 文本预览浮层 */
  #text-overlay {
    position: fixed; left: 0; right: 0; bottom: 0; top: 0; z-index: 100;
    background: rgba(10, 14, 24, .96);
    border-top: 1px solid var(--border);
    padding: 12px 20px 20px; display: none; flex-direction: column;
  }
  #text-overlay.show { display: flex; }
  #text-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  #text-title { font-size: 13px; color: var(--text); flex: 1; word-break: break-all; }
  #text-close {
    background: var(--panel2); border: 1px solid var(--border);
    color: var(--muted); border-radius: 6px; padding: 3px 10px;
    cursor: pointer; font-size: 12px;
  }
  #text-close:hover { color: #fff; border-color: var(--accent); }
  #text-content {
    flex: 1; overflow: auto; margin: 0; padding: 14px;
    background: #0a0e18; border: 1px solid var(--border); border-radius: 8px;
    font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px;
    line-height: 1.6; color: #d5dcec; white-space: pre-wrap; word-break: break-all;
  }
  #text-hint { font-size: 12px; color: var(--muted); margin-top: 6px; }

  /* PDF 查看浮层（PDF.js 按需加载） */
  #pdf-overlay {
    position: fixed; left: 0; right: 0; bottom: 0; top: 0; z-index: 100;
    background: rgba(10, 14, 24, .97);
    padding: 12px 16px 16px; display: none; flex-direction: column;
  }
  #pdf-overlay.show { display: flex; }
  #pdf-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  #pdf-title { font-size: 13px; color: var(--text); flex: 1; word-break: break-all; }
  #pdf-close {
    background: var(--panel2); border: 1px solid var(--border);
    color: var(--muted); border-radius: 6px; padding: 3px 10px;
    cursor: pointer; font-size: 12px;
  }
  #pdf-close:hover { color: #fff; border-color: var(--accent); }
  #pdf-body {
    flex: 1; overflow: auto; display: flex; justify-content: center; align-items: flex-start;
    background: #0a0e18; border: 1px solid var(--border); border-radius: 8px; padding: 12px;
    position: relative;  /* 供 loading 浮层绝对定位 */
  }
  #pdf-canvas { max-width: 100%; box-shadow: 0 2px 12px rgba(0,0,0,.5); background: #fff; }
  /* 加载浮层：覆盖在 canvas 上方居中，翻页时旧页保留可见（不白板） */
  #pdf-loading {
    position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
    color: var(--text); font-size: 14px; padding: 14px 22px;
    background: rgba(20, 28, 48, .92); border: 1px solid var(--border); border-radius: 10px;
    z-index: 5; display: none;
  }
  #pdf-controls {
    display: flex; align-items: center; justify-content: center; gap: 16px;
    padding-top: 10px;
  }
  #pdf-controls button {
    background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 6px 16px; cursor: pointer; font-size: 13px;
  }
  #pdf-controls button:hover:not(:disabled) { border-color: var(--accent); }
  #pdf-controls button:disabled { opacity: .4; cursor: default; }
  #pdf-page-info { font-size: 13px; color: var(--muted); min-width: 70px; text-align: center; }
  #pdf-jump {
    width: 70px; padding: 6px 8px; font-size: 13px; text-align: center;
    background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; outline: none;
  }
  #pdf-jump:focus { border-color: var(--accent); }
  .pdf-sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
  #pdf-controls button#pdf-zoom-out,
  #pdf-controls button#pdf-zoom-in {
    width: 36px; padding: 6px 0; font-size: 16px;
  }
  #pdf-zoom-info { font-size: 12px; color: var(--muted); min-width: 44px; text-align: center; }
  #pdf-hint { font-size: 12px; color: var(--muted); margin-top: 6px; }

  /* ============================================================
     响应式适配
     · 769–1024px：窄桌面/平板，紧凑布局
     · ≤768px：手机，按钮横滑、触屏加大、内容贴边
  ============================================================ */
  @media (max-width: 1024px) {
    header { flex-wrap: wrap; gap: 8px; padding: 10px 14px; }
    header h1 { font-size: 16px; }
    #roots-bar { margin-left: 0; flex: 1 1 auto; }
    #shortcuts-bar { margin-left: 0; padding-left: 0; border-left: none; }
    main { padding: 14px; }
    .root-btn, .shortcut-btn { padding: 5px 12px; font-size: 12px; }
  }

  @media (max-width: 768px) {
    header { gap: 8px; padding: 10px 12px; }
    header h1 { width: 100%; }           /* 标题独占一行 */
    #roots-bar {
      flex: 1 1 auto; flex-wrap: nowrap; overflow-x: auto;  /* 横滑 */
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
      margin-left: 0; padding-bottom: 2px;
    }
    #roots-bar::-webkit-scrollbar { display: none; }
    .root-btn { flex-shrink: 0; }
    #shortcuts-bar {
      flex: 1 1 auto; flex-wrap: nowrap; overflow-x: auto;  /* 横滑 */
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
      margin-left: 0; padding-left: 0; border-left: none; width: 100%;
    }
    #shortcuts-bar::-webkit-scrollbar { display: none; }
    .shortcut-btn { flex-shrink: 0; }
    main { padding: 10px 12px; }
    #breadcrumb { font-size: 13px; margin-bottom: 10px; }
    #back-btn { padding: 6px 14px; }     /* 触屏加大点击区 */
    .item { padding: 13px 12px; margin-bottom: 6px; gap: 10px; }
    .item .icon { font-size: 20px; width: 26px; }
    .item .name { font-size: 14px; }
    .item .meta { font-size: 11px; }
    #player-overlay { padding: 10px 12px; }
    #text-overlay { padding: 10px 12px 14px; }
    #text-content { padding: 10px; font-size: 12px; }
    .empty, #loading { padding: 28px; }
  }
</style>
</head>
<body>

<header>
  <h1>📂 本地文件浏览器</h1>
  <div id="roots-bar"><span style="color:var(--muted);font-size:13px">加载根目录...</span></div>
  <div id="shortcuts-bar" style="display:none"></div>
  <div id="search-box">
    <input id="search-input" type="search" list="search-history-dl" placeholder="🔍 搜索文件..." autocomplete="off">
    <datalist id="search-history-dl"></datalist>
    <select id="search-type">
      <option value="">全部</option>
      <option value="video">视频</option>
      <option value="audio">音频</option>
      <option value="pdf">PDF</option>
      <option value="image">图片</option>
      <option value="text">文本</option>
      <option value="dir">文件夹</option>
    </select>
    <button id="search-clear" title="清除搜索">✕</button>
  </div>
</header>

<main>
  <div id="breadcrumb"></div>
  <div id="loading">加载中...</div>
  <ul id="file-list"></ul>
</main>

<!-- 播放器浮层 -->
<div id="player-overlay">
  <div id="player-head">
    <span id="player-title"></span>
    <button id="player-fullscreen" title="全屏播放">⛶</button>
    <button id="player-close">✕ 关闭</button>
  </div>
  <div id="video-wrap">
    <video id="player-video" controls preload="auto" style="display:none"></video>
    <button id="fs-exit-toggle" title="退出全屏" style="display:none">⛶</button>
    <button id="fs-play-toggle" title="播放/暂停" style="display:none">⏸</button>
  </div>
  <audio id="player-audio" controls preload="auto" style="display:none"></audio>
  <div id="player-hint"></div>
</div>

<!-- 文本预览浮层 -->
<div id="text-overlay">
  <div id="text-head">
    <span id="text-title"></span>
    <button id="text-close">✕ 关闭</button>
  </div>
  <pre id="text-content">加载中...</pre>
  <div id="text-hint"></div>
</div>

<!-- PDF 查看浮层（PDF.js 按需加载） -->
<div id="pdf-overlay">
  <div id="pdf-head">
    <span id="pdf-title"></span>
    <button id="pdf-close">✕ 关闭</button>
  </div>
  <div id="pdf-body">
    <canvas id="pdf-canvas"></canvas>
    <div id="pdf-loading">📄 加载中...</div>
  </div>
  <div id="pdf-controls">
    <button id="pdf-prev">◀ 上一页</button>
    <span id="pdf-page-info">- / -</span>
    <input id="pdf-jump" type="number" min="1" step="1" placeholder="跳转页" title="输入页码后回车跳转">
    <button id="pdf-next">下一页 ▶</button>
    <span class="pdf-sep"></span>
    <button id="pdf-zoom-out" title="缩小">−</button>
    <button id="pdf-zoom-reset" title="适应宽度">适应</button>
    <button id="pdf-zoom-in" title="放大">＋</button>
    <span id="pdf-zoom-info">100%</span>
  </div>
  <div id="pdf-hint"></div>
</div>

<script>
// ============================================================
// 全局状态
// ============================================================
let roots = [];        // 配置的根目录
let currentRoot = 0;   // 当前根目录索引
let currentPath = '';  // 当前相对路径（根目录内）
let entries = [];      // 当前列表

const $ = id => document.getElementById(id);
const fileListEl = $('file-list');
const breadcrumbEl = $('breadcrumb');
const loadingEl = $('loading');

// 文件图标
const ICONS = {
  dir: '📁', video: '🎬', audio: '🎵', pdf: '📄', image: '🖼️', text: '📝', file: '📦', hidden: '🔒',
};

// ============================================================
// URL hash 路由：把导航状态（根目录 + 路径）写入 URL，
// 刷新后从 hash 恢复，不再回到主页；支持浏览器前进/后退
//   目录格式: #/rootIndex/path1/path2
//   搜索格式: #s/rootIndex/关键词（搜索状态也纳入历史，返回可恢复）
// ============================================================
function encodeState() {
  const segs = currentPath.split('/').filter(Boolean).map(encodeURIComponent);
  return '#/' + currentRoot + (segs.length ? '/' + segs.join('/') : '');
}

function encodeSearchState(q) {
  return '#s/' + currentRoot + '/' + encodeURIComponent(q);
}

function parseHash() {
  const h = location.hash || '';
  // 搜索状态：#s/root/q
  const sm = /^#s\/(\d+)\/(.*)$/.exec(h);
  if (sm) {
    let q = '';
    try { q = decodeURIComponent(sm[2]); } catch (e) { /* 解码失败则空词 */ }
    return { search: true, root: parseInt(sm[1], 10) || 0, q };
  }
  // 目录状态：#/root/path
  const m = /^#\/(\d+)(?:\/(.*))?$/.exec(h);
  if (!m) return { search: false, root: 0, path: '' };
  const root = parseInt(m[1], 10);
  let path = '';
  if (m[2] !== undefined) {
    try {
      path = '/' + m[2].split('/').map(decodeURIComponent).join('/');
    } catch (e) { return { search: false, root: 0, path: '' }; }
  }
  return { search: false, root, path };
}

// 导航成功后把状态写入 URL（pushState 产生历史记录，支持后退）
function syncUrl() {
  const target = encodeState();
  if (location.hash !== target) {
    history.pushState(null, '', target);
  }
}

// 搜索成功后把搜索状态写入 URL（进入文件夹后再返回，可回到搜索页）
function syncSearchUrl(q) {
  const target = encodeSearchState(q);
  if (location.hash !== target) {
    history.pushState(null, '', target);
  }
}

// ============================================================
// 滚动位置记忆（sessionStorage）：刷新后回到之前的滚动位置
// ============================================================
const SCROLL_KEY = 'lfb-scroll-loc';
const SCROLL_POS_KEY = 'lfb-scroll-pos';

function saveScrollState() {
  try {
    sessionStorage.setItem(SCROLL_KEY, currentRoot + ':' + currentPath);
    sessionStorage.setItem(SCROLL_POS_KEY, String(window.scrollY || 0));
  } catch (e) { /* 隐私模式禁用 sessionStorage 时忽略 */ }
}

function restoreScrollState() {
  try {
    const loc = sessionStorage.getItem(SCROLL_KEY);
    if (loc === currentRoot + ':' + currentPath) {
      window.scrollTo(0, parseInt(sessionStorage.getItem(SCROLL_POS_KEY) || '0', 10));
    }
  } catch (e) { /* ignore */ }
}

// 搜索结果的滚动位置记忆（按关键词绑定，返回搜索页时还原）
const SEARCH_SCROLL_KEY = 'lfb-search-scroll';
function saveSearchScroll(q) {
  try {
    sessionStorage.setItem(SEARCH_SCROLL_KEY, JSON.stringify({ q, y: window.scrollY || 0 }));
  } catch (e) { /* ignore */ }
}
function restoreSearchScroll(q) {
  try {
    const saved = JSON.parse(sessionStorage.getItem(SEARCH_SCROLL_KEY) || 'null');
    if (saved && saved.q === q) {
      window.scrollTo(0, saved.y || 0);
      sessionStorage.removeItem(SEARCH_SCROLL_KEY);
    }
  } catch (e) { /* ignore */ }
}

// ============================================================
// 根目录加载
// ============================================================
async function loadRoots() {
  try {
    const res = await fetch('/local/api/roots');
    const data = await res.json();
    roots = data.roots || [];
    // 读取 PDF 预加载页数配置（热重载后重新拉取生效）
    if (data.pdfPreloadPages > 0) pdfPreloadPages = data.pdfPreloadPages;
    const bar = $('roots-bar');
    bar.innerHTML = '';
    roots.forEach(r => {
      const btn = document.createElement('button');
      btn.className = 'root-btn' + (r.index === currentRoot ? ' active' : '');
      btn.textContent = r.name;
      btn.onclick = () => switchRoot(r.index);
      bar.appendChild(btn);
    });
    if (roots.length === 0) {
      bar.innerHTML = '<span style="color:#ff8787">⚠️ 未配置任何根目录</span>';
    }

    // 渲染快捷访问栏（⭐ 直达常用文件夹）
    renderShortcuts(data.shortcuts || []);

    // 从 URL hash 恢复导航位置（刷新/直接访问链接时不再回主页）
    const st = parseHash();
    if (roots[st.root]) {
      currentRoot = st.root;
      document.querySelectorAll('.root-btn').forEach((b, i) => b.classList.toggle('active', i === st.root));
    }
    if (st.search) {
      // 搜索状态：恢复搜索词并重新搜索
      searchInput.value = st.q || '';
      if (st.q) { doSearch(st.q); return; }
      currentPath = '';
      loadList();
    } else {
      currentPath = st.path || '';
      loadList();
    }
  } catch (e) {
    console.error(e);
    bar.innerHTML = '<span style="color:#ff8787">⚠️ 加载根目录失败</span>';
  }
}

function switchRoot(idx) {
  if (idx === currentRoot) return;
  saveScrollState();  // 记录离开前的滚动位置
  currentRoot = idx;
  currentPath = '';
  document.querySelectorAll('.root-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
  // 搜索模式下切换根目录：用当前关键词在新根目录重新搜索
  const q = searchInput.value.trim();
  if (searchMode && q) {
    doSearch(q);
  } else {
    loadList();
  }
}

// ============================================================
// 快捷访问栏：⭐ 直达配置的常用文件夹
// ============================================================
function renderShortcuts(list) {
  const bar = $('shortcuts-bar');
  bar.innerHTML = '';
  if (!list || list.length === 0) {
    bar.style.display = 'none';
    return;
  }
  bar.style.display = 'flex';
  const label = document.createElement('span');
  label.className = 'sc-label';
  label.textContent = '⭐ 快捷';
  bar.appendChild(label);
  list.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'shortcut-btn';
    btn.textContent = s.name;
    btn.title = '直达: ' + (roots[s.root] ? roots[s.root].name : '?') + s.path;
    btn.onclick = () => jumpToShortcut(s);
    bar.appendChild(btn);
  });
}

// 跳到快捷文件夹（复用现有导航：同步 URL、滚动记忆、缓存均生效）
function jumpToShortcut(s) {
  if (s.root === currentRoot && s.path === currentPath) return;
  saveScrollState();
  currentRoot = s.root;
  currentPath = s.path;
  document.querySelectorAll('.root-btn').forEach((b, i) => b.classList.toggle('active', i === s.root));
  loadList();
}

// ============================================================
// 文件列表加载
// ============================================================
async function loadList() {
  loadingEl.style.display = 'block';
  fileListEl.innerHTML = '';
  breadcrumbEl.innerHTML = '';
  try {
    const qs = new URLSearchParams({ root: currentRoot, path: currentPath });
    const res = await fetch('/local/api/list?' + qs.toString());
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || ('HTTP ' + res.status));
    }
    const data = await res.json();
    entries = data.entries || [];
    renderBreadcrumb(data.current ? data.current.path : currentPath);
    renderList();
    // 加载成功：同步 URL（hash）并恢复上次滚动位置（若有）
    syncUrl();
    restoreScrollState();
  } catch (e) {
    loadingEl.style.display = 'none';
    fileListEl.innerHTML = `<li class="empty">❌ 加载失败: ${e.message}</li>`;
  }
}

function renderBreadcrumb(pathStr) {
  // 面包屑: 根 / a / b
  breadcrumbEl.innerHTML = '';
  if (currentPath) {
    const back = document.createElement('button');
    back.id = 'back-btn';
    back.textContent = '← 返回';
    back.onclick = () => goUp();
    breadcrumbEl.appendChild(back);
  }
  const parts = (pathStr === '/' ? '' : pathStr).split('/').filter(Boolean);
  const addCrumb = (label, idx) => {
    const c = document.createElement('span');
    c.className = 'crumb';
    c.textContent = label;
    c.onclick = () => { saveScrollState(); currentPath = parts.slice(0, idx).join('/'); loadList(); };
    breadcrumbEl.appendChild(c);
  };
  addCrumb('📁 ' + (roots[currentRoot] ? roots[currentRoot].name : '根目录'), 0);
  parts.forEach((p, i) => {
    const sep = document.createElement('span');
    sep.className = 'sep';
    sep.textContent = ' / ';
    breadcrumbEl.appendChild(sep);
    if (i === parts.length - 1) {
      const cur = document.createElement('span');
      cur.className = 'cur';
      cur.textContent = p;
      breadcrumbEl.appendChild(cur);
    } else {
      addCrumb(p, i + 1);
    }
  });
}

function goUp() {
  saveScrollState();  // 记录离开前的滚动位置
  currentPath = currentPath.split('/').filter(Boolean).slice(0, -1).join('/');
  loadList();
}

function formatSize(bytes) {
  if (!bytes && bytes !== 0) return '';
  if (bytes < 1024) return bytes + ' B';
  const units = ['KB', 'MB', 'GB', 'TB'];
  let v = bytes, u = -1;
  do { v /= 1024; u++; } while (v >= 1024 && u < units.length - 1);
  return v.toFixed(1) + ' ' + units[u];
}

function renderList() {
  loadingEl.style.display = 'none';
  fileListEl.innerHTML = '';
  if (entries.length === 0) {
    fileListEl.innerHTML = '<li class="empty">📂 此文件夹为空</li>';
    return;
  }
  entries.forEach(e => {
    const li = document.createElement('li');
    // 访问过的文件/目录加 .visited 类（淡紫色标识）
    li.className = 'item ' + e.kind + (isVisited(e) ? ' visited' : '');
    li.innerHTML = `
      <span class="icon">${ICONS[e.kind] || '📦'}</span>
      <span class="name">${escapeHtml(e.name)}</span>
      <span class="meta">${e.isDir ? '' : formatSize(e.size)}</span>
    `;
    li.onclick = () => {
      handleClick(e);
      // 立即标记（不等刷新）：文件点击后马上变淡紫色
      if (!e.isDir) li.classList.add('visited');
    };
    fileListEl.appendChild(li);
  });
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

// ============================================================
// 点击行为
//   文件夹 → 进入
//   视频/音频 → 浮层播放
//   PDF/图片 → 新标签页在线查看
//   其他 → 下载
// ============================================================
function fileUrl(e) {
  const qs = new URLSearchParams({ root: currentRoot, path: e.path });
  return '/local/file?' + qs.toString();
}

function handleClick(e) {
  if (e.kind === 'hidden') return;
  if (e.isDir) {
    markVisited(e);  // 记录"访问过的目录"，返回上级时以 .visited 淡紫色标识
    if (searchMode) { enterDirFromSearch(e); return; }  // 搜索结果里的文件夹：退出搜索并进入
    saveScrollState();  // 记录离开前的滚动位置
    currentPath = e.path;
    loadList();
    return;
  }
  markVisited(e);  // 记录"已点击过"，列表渲染时以 .visited 淡紫色标识
  if (e.kind === 'video' || e.kind === 'audio') {
    openPlayer(e);
  } else if (e.kind === 'pdf') {
    openPdfPreview(e);  // PDF.js 浮层按需加载（大文件秒开）
  } else if (e.kind === 'image') {
    window.open(fileUrl(e), '_blank'); // 图片新标签页查看
  } else if (e.kind === 'text') {
    openTextPreview(e);
  } else {
    // 其他文件 → 下载
    const a = document.createElement('a');
    a.href = fileUrl(e);
    a.download = e.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }
}

// ============================================================
// 已访问标记（localStorage）：记录点击过的文件，列表里以淡紫色显示
// ============================================================
const VISITED_KEY = 'lfb-visited';
const VISITED_MAX = 200;

function getVisited() {
  try {
    const arr = JSON.parse(localStorage.getItem(VISITED_KEY) || '[]');
    return Array.isArray(arr) ? arr : [];
  } catch (e) { return []; }
}

function markVisited(e) {
  const id = currentRoot + ':' + e.path;
  const arr = getVisited().filter(x => x !== id);
  arr.unshift(id);
  if (arr.length > VISITED_MAX) arr.length = VISITED_MAX;
  try { localStorage.setItem(VISITED_KEY, JSON.stringify(arr)); } catch (err) { /* ignore */ }
}

function isVisited(e) {
  return getVisited().includes(currentRoot + ':' + e.path);
}

// ============================================================
// 搜索：防抖输入 + AbortController 竞态控制（旧请求取消、旧结果丢弃）
// ============================================================
const searchInput = $('search-input');
const searchTypeSel = $('search-type');
const searchClearBtn = $('search-clear');
let searchController = null;  // 当前搜索请求的 AbortController
let searchSeq = 0;            // 请求序号，防止旧结果晚到覆盖新结果
let searchMode = false;       // 是否处于搜索结果视图
let searchResults = [];       // 当前搜索结果
let searchTimer = null;       // 防抖定时器

// 搜索结果内存缓存：返回搜索页时直接出结果，不重复请求后台
//   key = `${当前根目录}:${关键词}`（搜索结果与根目录强相关）
//   value = { results, total, truncated, cachedAt }
const SEARCH_CACHE_TTL_MS = 60 * 1000;  // 60 秒 TTL，文件变化后最多延迟 60s 可见新结果
const SEARCH_CACHE_MAX = 50;            // 最多缓存 50 条，超出按插入顺序淘汰最旧
const searchCache = new Map();

function searchCacheKey(q) {
  return currentRoot + ':' + q;
}

// 读取缓存：命中且未超 TTL 返回数据，否则返回 null
function getSearchCache(q) {
  const key = searchCacheKey(q);
  const hit = searchCache.get(key);
  if (hit && Date.now() - hit.cachedAt < SEARCH_CACHE_TTL_MS) {
    return hit;
  }
  return null;
}

// 写入缓存（超出上限时淘汰最旧一条）
function setSearchCache(q, data) {
  searchCache.set(searchCacheKey(q), { ...data, cachedAt: Date.now() });
  if (searchCache.size > SEARCH_CACHE_MAX) {
    const oldest = searchCache.keys().next().value;
    searchCache.delete(oldest);
  }
}

// 防抖：停止输入 300ms 后才发起搜索
searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  const q = searchInput.value.trim();
  if (!q) {
    // 关键词清空：中断搜索并恢复到未搜索的目录视图
    const wasSearching = searchMode;
    cancelSearch();
    searchTypeSel.value = '';
    if (wasSearching) {
      searchMode = false;
      searchResults = [];
      loadList();
    }
    return;
  }
  searchTimer = setTimeout(() => doSearch(q), 300);
});

// 类型过滤变化：若在搜索视图则重新渲染（前端过滤已返回结果）
searchTypeSel.addEventListener('change', () => {
  if (searchMode) renderSearchResults();
});

// 清除搜索：中断请求、清空输入、回到目录视图
searchClearBtn.addEventListener('click', () => {
  cancelSearch();
  searchInput.value = '';
  searchTypeSel.value = '';
  if (searchMode) { searchMode = false; searchResults = []; loadList(); }
});

// 取消/中断当前搜索（换词、清除、切目录时都会触发）
function cancelSearch() {
  if (searchController) { searchController.abort(); searchController = null; }
  searchSeq++;  // 使所有在途结果失效
  searchClearBtn.style.display = 'none';
}

// ============================================================
// 搜索历史（localStorage，最近 10 条，供 datalist 下拉选择）
// ============================================================
const SEARCH_HISTORY_KEY = 'lfb-search-history';
const SEARCH_HISTORY_MAX = 10;

function getSearchHistory() {
  try {
    const arr = JSON.parse(localStorage.getItem(SEARCH_HISTORY_KEY) || '[]');
    return Array.isArray(arr) ? arr : [];
  } catch (e) { return []; }
}

function saveSearchHistory(q) {
  const arr = getSearchHistory().filter(x => x !== q);
  arr.unshift(q);
  if (arr.length > SEARCH_HISTORY_MAX) arr.length = SEARCH_HISTORY_MAX;
  try { localStorage.setItem(SEARCH_HISTORY_KEY, JSON.stringify(arr)); } catch (e) { /* ignore */ }
  renderSearchHistory();
}

function renderSearchHistory() {
  const dl = $('search-history-dl');
  dl.innerHTML = '';
  getSearchHistory().forEach(q => {
    const opt = document.createElement('option');
    opt.value = q;
    dl.appendChild(opt);
  });
}
renderSearchHistory();

async function doSearch(q) {
  if (searchController) searchController.abort();  // 取消上一个请求
  const controller = new AbortController();
  searchController = controller;
  const seq = ++searchSeq;
  searchMode = true;
  searchClearBtn.style.display = 'inline-block';

  // 命中缓存：不请求后台，直接渲染结果（返回搜索页时秒出）
  const cached = getSearchCache(q);
  if (cached) {
    if (seq !== searchSeq) return;
    searchResults = cached.results || [];
    renderSearchResults();
    restoreSearchScroll(q);  // 返回搜索页时还原之前保存的滚动位置
    syncSearchUrl(q);        // 同步 URL（已是同状态则不再入栈）
    return;
  }

  loadingEl.style.display = 'block';
  fileListEl.innerHTML = '';
  breadcrumbEl.innerHTML = '';
  try {
    const qs = new URLSearchParams({ root: currentRoot, q });
    const res = await fetch('/local/api/search?' + qs.toString(), { signal: controller.signal });
    if (seq !== searchSeq) return;  // 已有更新的请求，丢弃本次结果
    const data = await res.json();
    if (seq !== searchSeq) return;
    searchResults = data.results || [];
    setSearchCache(q, { results: searchResults, total: data.total, truncated: data.truncated });
    if (searchResults.length > 0) saveSearchHistory(q);  // 有结果才记历史
    renderSearchResults();
    restoreSearchScroll(q);  // 返回搜索页时还原之前保存的滚动位置
    // 搜索状态写入 URL：返回/前进可回到搜索页；若 URL 已是同状态则不再入栈
    syncSearchUrl(q);
  } catch (err) {
    if (err.name === 'AbortError') return;  // 被更新的请求取消，忽略
    if (seq !== searchSeq) return;
    loadingEl.style.display = 'none';
    fileListEl.innerHTML = `<li class="empty">❌ 搜索失败: ${err.message}</li>`;
  } finally {
    if (searchController === controller) searchController = null;
  }
}

// 高亮文件名中匹配关键词的部分（前端过滤后的结果同样高亮）
function highlightMatch(name) {
  const words = (searchInput.value || '').trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return escapeHtml(name);
  let html = escapeHtml(name);
  for (const w of words) {
    // 大小写不敏感高亮；用占位避免替换后再次匹配到已插入的标签
    const re = new RegExp(escapeRegExp(w), 'gi');
    html = html.replace(re, m => `\u0000${m}\u0001`);
  }
  // 把占位符转成 <mark> 标签
  return html.replace(/\u0000/g, '<mark>').replace(/\u0001/g, '</mark>');
}

function escapeRegExp(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

// 缩短路径显示：去掉文件名本身，只保留所在目录最后两层，前段用 … 省略
function shortenPath(p) {
  if (!p) return '';
  const parts = p.split('/').filter(Boolean);
  parts.pop(); // 去掉文件名（文件名已单独显示）
  if (parts.length === 0) return '/';  // 文件就在根目录下
  const tail = parts.slice(-2);
  return (parts.length > 2 ? '…/' : '/') + tail.join('/');
}

// 渲染搜索结果视图：类型过滤（前端过滤已返回结果）+ 高亮 + 路径
function renderSearchResults() {
  loadingEl.style.display = 'none';
  fileListEl.innerHTML = '';

  const type = searchTypeSel.value;
  const list = type ? searchResults.filter(r => r.kind === type) : searchResults;

  if (list.length === 0) {
    fileListEl.innerHTML = `<li class="empty">🔍 未找到匹配的文件${type ? '（类型: ' + type + '）' : ''}</li>`;
    return;
  }

  // 结果统计条
  const stat = document.createElement('li');
  stat.className = 'empty';
  stat.style.fontSize = '13px';
  stat.style.padding = '10px';
  stat.style.textAlign = 'left';
  stat.textContent = `🔍 找到 ${searchResults.length} 个结果${type ? `（显示 ${list.length} 个 ${type}）` : ''}${searchResults.length >= 200 ? '，结果过多建议细化关键词' : ''}`;
  fileListEl.appendChild(stat);

  list.forEach(e => {
    const li = document.createElement('li');
    // 访问过的文件/目录加 .visited 类（淡紫色标识）
    li.className = 'item ' + e.kind + (isVisited(e) ? ' visited' : '');
    li.innerHTML = `
      <span class="icon">${ICONS[e.kind] || '📦'}</span>
      <span class="name">${highlightMatch(e.name)}</span>
      <span class="search-result-path" title="${escapeHtml(e.isDir ? '' : e.path)}">${escapeHtml(e.isDir ? '' : shortenPath(e.path))}</span>
      <span class="meta">${e.isDir ? '' : formatSize(e.size)}</span>
    `;
    li.onclick = () => {
      handleClick(e);
      // 立即标记（不等刷新）：文件点击后马上变淡紫色
      if (!e.isDir) li.classList.add('visited');
    };
    fileListEl.appendChild(li);
  });
}

// 点击搜索结果进入目录时：退出搜索模式，跳到该目录
function enterDirFromSearch(e) {
  const q = searchInput.value.trim();
  saveSearchScroll(q);  // 记住当前搜索滚动位置（按关键词，返回时可还原）
  cancelSearch();
  searchInput.value = '';
  searchTypeSel.value = '';
  searchMode = false;
  searchResults = [];
  saveScrollState();
  currentPath = e.path;
  loadList();
}

// ============================================================
// 播放器浮层
// ============================================================
const overlay = $('player-overlay');
const videoEl = $('player-video');
const audioEl = $('player-audio');

function openPlayer(e) {
  const url = fileUrl(e);
  $('player-title').textContent = (e.kind === 'video' ? '🎬 ' : '🎵 ') + e.name;
  $('player-hint').textContent = '';
  videoEl.pause(); audioEl.pause();
  if (e.kind === 'video') {
    videoEl.style.display = 'block';
    audioEl.style.display = 'none';
    videoEl.src = url;
    videoEl.play().catch(() => {});
  } else {
    audioEl.style.display = 'block';
    videoEl.style.display = 'none';
    audioEl.src = url;
    audioEl.play().catch(() => {});
  }
  overlay.classList.add('show');
  overlay.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

function closePlayer() {
  videoEl.pause(); videoEl.src = '';
  audioEl.pause(); audioEl.src = '';
  overlay.classList.remove('show');
}

$('player-close').onclick = closePlayer;

// ============================================================
// 全屏播放：浮窗全屏按钮 + 全屏状态监听（含 Safari 前缀兼容）
// ============================================================
const videoWrap = $('video-wrap');
const fsPlayToggle = $('fs-play-toggle');
const fsExitToggle = $('fs-exit-toggle');
const fullscreenBtn = $('player-fullscreen');

function isFullscreen() {
  return !!(document.fullscreenElement ||
            document.webkitFullscreenElement ||
            document.mozFullScreenElement ||
            document.msFullscreenElement);
}

function toggleFullscreen() {
  if (isFullscreen()) {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
  } else {
    if (videoWrap.requestFullscreen) videoWrap.requestFullscreen();
    else if (videoWrap.webkitRequestFullscreen) videoWrap.webkitRequestFullscreen();
    else if (videoWrap.mozRequestFullScreen) videoWrap.mozRequestFullScreen();
    else if (videoWrap.msRequestFullscreen) videoWrap.msRequestFullscreen();
  }
}

function updateFullscreenUI() {
  const fs = isFullscreen();
  fullscreenBtn.textContent = fs ? '⛶ 退出' : '⛶';
  fullscreenBtn.title = fs ? '退出全屏' : '全屏播放';
  fsPlayToggle.style.display = fs ? 'block' : 'none';
  fsExitToggle.style.display = fs ? 'block' : 'none';
  if (fs) syncPlayToggleIcon();
}

fullscreenBtn.onclick = toggleFullscreen;

// 全屏容器内的退出按钮：触屏无键盘也能退出
fsExitToggle.onclick = () => {
  if (document.exitFullscreen) document.exitFullscreen();
  else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
};

// 全屏状态变化（标准 + Safari/旧内核前缀）
document.addEventListener('fullscreenchange', updateFullscreenUI);
document.addEventListener('webkitfullscreenchange', updateFullscreenUI);
document.addEventListener('mozfullscreenchange', updateFullscreenUI);
document.addEventListener('MSFullscreenChange', updateFullscreenUI);

// 全屏时右下角大播放/暂停按钮：点击切换播放状态
function syncPlayToggleIcon() {
  fsPlayToggle.textContent = videoEl.paused ? '▶' : '⏸';
}
fsPlayToggle.onclick = () => {
  if (videoEl.paused) videoEl.play().catch(() => {});
  else videoEl.pause();
};
videoEl.addEventListener('play', syncPlayToggleIcon);
videoEl.addEventListener('pause', syncPlayToggleIcon);

// 视频播放失败提示（如浏览器不支持的编码格式，可提示下载）
videoEl.addEventListener('error', () => {
  const msg = '⚠️ 该视频格式浏览器无法直接播放（编码不支持），可点击列表再次选择或换用支持 MP4/H.264 的文件。';
  $('player-hint').textContent = msg;
});
audioEl.addEventListener('error', () => {
  $('player-hint').textContent = '⚠️ 该音频格式浏览器无法直接播放。';
});

// ============================================================
// 文本预览
// ============================================================
const textOverlay = $('text-overlay');
const textContentEl = $('text-content');
const TEXT_PREVIEW_MAX = 2 * 1024 * 1024; // 超过 2MB 不预览，提示下载

// 编码探测：优先按 UTF-8 严格解码；失败（含非法字节序列）则回退 GBK/GB18030
// （Windows 上常见的 GBK 编码 txt 文件，按 UTF-8 解码会乱码）
function decodeTextBytes(buf) {
  try {
    return new TextDecoder('utf-8', { fatal: true }).decode(buf);
  } catch (e) {
    return new TextDecoder('gbk').decode(buf);
  }
}

async function openTextPreview(e) {
  if (e.size > TEXT_PREVIEW_MAX) {
    alert('文件较大（' + formatSize(e.size) + '），已为你下载。');
    const a = document.createElement('a');
    a.href = fileUrl(e);
    a.download = e.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    return;
  }
  $('text-title').textContent = '📝 ' + e.name;
  $('text-hint').textContent = '';
  textContentEl.textContent = '加载中...';
  textOverlay.classList.add('show');
  try {
    const res = await fetch(fileUrl(e));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const buf = await res.arrayBuffer();
    textContentEl.textContent = decodeTextBytes(buf);
  } catch (err) {
    textContentEl.textContent = '';
    $('text-hint').textContent = '❌ 加载失败: ' + err.message;
  }
}

function closeTextPreview() {
  textOverlay.classList.remove('show');
  textContentEl.textContent = '';
}

$('text-close').onclick = closeTextPreview;

// ============================================================
// PDF 查看（PDF.js 按需加载：打开即显示第一页，翻页才拉取数据）
// ============================================================
const pdfOverlay = $('pdf-overlay');
const pdfCanvas = $('pdf-canvas');
const pdfLoadingEl = $('pdf-loading');
const pdfPageInfo = $('pdf-page-info');
let pdfDoc = null;          // 当前 PDF 文档对象
let pdfPageNum = 1;         // 当前页
let pdfLoadTask = null;     // 当前加载任务（用于中断）
let pdfRendering = false;   // 是否正在渲染（防连点）
let pdfPosId = null;        // 当前 PDF 标识（root:path），用于记忆阅读位置
let pdfZoom = 0;            // 手动缩放值（0 = 适应宽度）
let pdfPreloadPages = 3;    // PDF 预加载页数（滑动窗口，从 /api/roots 读取）
const pdfPreloaded = new Set();  // 已预热页集合，避免重复请求

// 记住每篇 PDF 的阅读位置（localStorage，重开自动定位）
const PDF_POS_KEY = 'lfb-pdf-pos';
function savePdfPos() {
  if (!pdfPosId || !pdfDoc) return;
  try {
    const map = JSON.parse(localStorage.getItem(PDF_POS_KEY) || '{}');
    map[pdfPosId] = pdfPageNum;
    localStorage.setItem(PDF_POS_KEY, JSON.stringify(map));
  } catch (e) { /* ignore */ }
}
function getPdfPos() {
  if (!pdfPosId) return 0;
  try {
    const map = JSON.parse(localStorage.getItem(PDF_POS_KEY) || '{}');
    const p = parseInt(map[pdfPosId], 10);
    return Number.isFinite(p) && p > 0 ? p : 0;
  } catch (e) { return 0; }
}

async function openPdfPreview(e) {
  $('pdf-title').textContent = '📄 ' + e.name;
  $('pdf-hint').textContent = '';
  pdfLoadingEl.style.display = 'block';
  pdfCanvas.style.display = 'none';
  pdfOverlay.classList.add('show');

  // 重置分页状态：切换文件时不沿用上一个 PDF 的页码
  pdfPageNum = 1;
  pdfPageInfo.textContent = '- / -';
  $('pdf-prev').disabled = true;
  $('pdf-next').disabled = true;

  try {
    // 按需动态加载 PDF.js（首次点击时才加载库本身）
    const pdfjs = await import('/local/pdfjs/pdf.min.mjs');
    pdfjs.GlobalWorkerOptions.workerSrc = '/local/pdfjs/pdf.worker.min.mjs';

    // 中断上一次加载（快速切换文件时）
    if (pdfLoadTask) { try { pdfLoadTask.destroy(); } catch (err) {} }

    // 关键：disableAutoFetch + disableStream + 服务端 Range 206 → 只拉取需要的部分
    // disableStream 强制 PDF.js 走 Range 分片而非流式全量读取（探测请求会立即取消）
    pdfLoadTask = pdfjs.getDocument({
      url: fileUrl(e),
      disableAutoFetch: true,   // 不预取整份文档
      disableStream: true,      // 禁用流式读取，强制按需 Range 分片
      rangeChunkSize: 65536,    // 分片大小 64KB
      isEvalSupported: false,   // 兼容性更稳
    });
    // 加载进度回调：加载浮层显示整体百分比（按需加载时 total 可能为 0，则只显示"加载中"）
    pdfLoadTask.onProgress = ({ loaded, total }) => {
      if (total > 0) {
        const pct = Math.min(100, Math.round((loaded / total) * 100));
        pdfLoadingEl.textContent = '📄 加载中... ' + pct + '%';
      }
    };
    pdfDoc = await pdfLoadTask.promise;
    pdfPosId = currentRoot + ':' + e.path;  // 记忆该 PDF 的阅读位置
    // 恢复上次阅读位置（有记录则跳回那一页，否则第 1 页）
    const saved = getPdfPos();
    pdfPageNum = (saved >= 1 && saved <= pdfDoc.numPages) ? saved : 1;
    await renderPdfPage();
    pdfLoadingEl.style.display = 'none';
    pdfCanvas.style.display = 'block';
  } catch (err) {
    pdfLoadingEl.style.display = 'none';
    $('pdf-hint').textContent = '❌ PDF 加载失败: ' + (err.message || err);
  }
}

async function renderPdfPage() {
  if (!pdfDoc || pdfRendering) return;
  pdfRendering = true;
  pdfLoadingEl.textContent = '📄 加载中...';  // 翻页无整体进度，重置为纯加载中
  pdfLoadingEl.style.display = 'block';  // 翻页/渲染期间显示加载浮层（旧页保留可见）
  try {
    const page = await pdfDoc.getPage(pdfPageNum);
    // 缩放：pdfZoom=0 时适应容器宽度；否则用手动缩放值
    const containerWidth = $('pdf-body').clientWidth - 40;
    const base = page.getViewport({ scale: 1 });
    let scale;
    if (pdfZoom > 0) {
      scale = pdfZoom;
    } else {
      scale = Math.min(2.5, Math.max(0.5, containerWidth / base.width));
    }
    const viewport = page.getViewport({ scale });
    pdfCanvas.width = viewport.width;
    pdfCanvas.height = viewport.height;
    const ctx = pdfCanvas.getContext('2d');
    await page.render({ canvasContext: ctx, viewport }).promise;
    pdfPageInfo.textContent = `${pdfPageNum} / ${pdfDoc.numPages}`;
    $('pdf-prev').disabled = pdfPageNum <= 1;
    $('pdf-next').disabled = pdfPageNum >= pdfDoc.numPages;
    savePdfPos();          // 记住当前阅读位置
  } finally {
    pdfLoadingEl.style.display = 'none';  // 渲染完成隐藏浮层
    pdfRendering = false;
  }
  // 本页渲染彻底完成后再发起预热（不争抢当前页渲染资源）
  setTimeout(preloadPdfPages, 0);
}

// 预加载后续 N 页（滑动窗口）：getOperatorList 真正拉取渲染指令并缓存，
// 翻页时 render() 命中缓存、不再发 Range 请求，公网浏览无感
function preloadPdfPages() {
  if (!pdfDoc) return;
  const max = Math.min(pdfPageNum + pdfPreloadPages, pdfDoc.numPages);
  for (let n = pdfPageNum + 1; n <= max; n++) {
    if (pdfPreloaded.has(n)) continue;  // 已预热过则跳过
    pdfPreloaded.add(n);
    pdfDoc.getPage(n)
      .then(p => p.getOperatorList())   // 真正拉取该页渲染指令并缓存
      .catch(() => { pdfPreloaded.delete(n); });  // 失败忽略，允许后续重试
  }
}

function closePdfPreview() {
  pdfOverlay.classList.remove('show');
  if (pdfLoadTask) { try { pdfLoadTask.destroy(); } catch (err) {} }
  pdfDoc = null;
  pdfLoadTask = null;
}

$('pdf-close').onclick = closePdfPreview;
$('pdf-prev').onclick = () => { if (pdfPageNum > 1) { pdfPageNum--; renderPdfPage(); } };
$('pdf-next').onclick = () => { if (pdfDoc && pdfPageNum < pdfDoc.numPages) { pdfPageNum++; renderPdfPage(); } };

// 缩放控制：放大/缩小/适应宽度（pdfZoom=0 表示适应宽度）
function updatePdfZoomInfo() {
  $('pdf-zoom-info').textContent = pdfZoom > 0 ? Math.round(pdfZoom * 100) + '%' : '适应';
}
$('pdf-zoom-in').onclick = () => {
  pdfZoom = Math.min(3, (pdfZoom > 0 ? pdfZoom : 1) + 0.25);
  updatePdfZoomInfo();
  renderPdfPage();
};
$('pdf-zoom-out').onclick = () => {
  pdfZoom = Math.max(0.5, (pdfZoom > 0 ? pdfZoom : 1) - 0.25);
  updatePdfZoomInfo();
  renderPdfPage();
};
$('pdf-zoom-reset').onclick = () => {
  pdfZoom = 0;  // 适应宽度
  updatePdfZoomInfo();
  renderPdfPage();
};

// 页码输入框：回车跳转（校验 1..numPages 范围）
$('pdf-jump').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const n = parseInt($('pdf-jump').value, 10);
  if (!pdfDoc || isNaN(n)) return;
  if (n < 1) { pdfPageNum = 1; }
  else if (n > pdfDoc.numPages) { pdfPageNum = pdfDoc.numPages; }
  else { pdfPageNum = n; }
  $('pdf-jump').value = '';
  renderPdfPage();
});

// 键盘翻页（浮层打开时）：← → 键
document.addEventListener('keydown', e => {
  if (!pdfOverlay.classList.contains('show')) return;
  if (e.key === 'ArrowLeft') { if (pdfPageNum > 1) { pdfPageNum--; renderPdfPage(); } }
  else if (e.key === 'ArrowRight') { if (pdfDoc && pdfPageNum < pdfDoc.numPages) { pdfPageNum++; renderPdfPage(); } }
});

// 键盘 Esc 关闭浮层（播放器或文本预览）
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (textOverlay.classList.contains('show')) closeTextPreview();
  else closePlayer();
});

// 刷新/关闭页面时保存滚动位置（供刷新后恢复）
window.addEventListener('pagehide', saveScrollState);

// ============================================================
// 浏览器前进/后退（popstate）或手动改 URL hash（hashchange）
// ============================================================
function applyUrlState() {
  const st = parseHash();
  // 非法 root 索引回退到主页
  if (!roots[st.root]) {
    currentRoot = 0;
    document.querySelectorAll('.root-btn').forEach((b, i) => b.classList.toggle('active', i === 0));
  } else {
    currentRoot = st.root;
    document.querySelectorAll('.root-btn').forEach((b, i) => b.classList.toggle('active', i === st.root));
  }

  if (st.search) {
    // 回到搜索状态：恢复关键词并重新搜索（状态未变则跳过，popstate/hashchange 会同时触发）
    const q = st.q || '';
    if (searchMode && searchInput.value.trim() === q) return;
    searchInput.value = q;
    if (q) { doSearch(q); return; }
    searchMode = false;
    searchResults = [];
    currentPath = '';
    loadList();
    return;
  }

  // 目录状态：状态未变则跳过
  if (!searchMode && st.path === currentPath) return;
  currentPath = st.path || '';
  loadList();
}
window.addEventListener('popstate', applyUrlState);
window.addEventListener('hashchange', applyUrlState);

// ============================================================
// 启动
// ============================================================
loadRoots();
</script>
</body>
</html>
